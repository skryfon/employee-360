services:
  postgres:
    image: postgres:16-alpine
    container_name: employee360-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      POSTGRES_DB: ${DATABASE_NAME:-employee360}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - employee360_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DATABASE_USER:-postgres} -d ${DATABASE_NAME:-employee360}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis: optional cache/counter store (enable with REDIS_ENABLED=true). Password
  # is required; set REDIS_PASSWORD in .env. Not exposed beyond localhost by default.
  redis:
    image: redis:8.10.2-alpine
    container_name: employee360-redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-redis}
      - --appendonly
      - "yes"
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - employee360_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis}
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  mailpit:
    image: axllent/mailpit:latest
    container_name: employee360-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  # River background worker: drains the transactional email outbox (river_job)
  # and delivers via SMTP (Mailpit in dev). No Dockerfile exists yet, so the
  # source tree is mounted and run with `go run`. Requires migrations to be applied.
  worker:
    image: golang:1.26-alpine
    container_name: employee360-worker
    restart: unless-stopped
    working_dir: /app
    command: go run ./cmd/worker
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: ${DATABASE_USER:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      DATABASE_NAME: ${DATABASE_NAME:-employee360}
      DATABASE_SSLMODE: disable
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_USE_TLS: "false"
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
    volumes:
      - ./backend:/app
      - employee360_worker_gocache:/go/pkg/mod

volumes:
  employee360_postgres_data:
  employee360_redis_data:
  employee360_worker_gocache:

