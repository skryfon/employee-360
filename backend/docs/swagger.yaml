info:
  contact: {}
  description: REST API for Employee360, an open-source, self-hostable, multi-tenant
    employee platform. Includes unversioned operational endpoints (health checks)
    and the versioned client-facing API under /api/v1.
  title: Employee360 API
  version: "1.0"
paths:
  /api/v1/auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Requests a password reset token to be sent to the given email address.
        Always returns 200 OK to prevent user enumeration.
      parameters:
      - description: Email for password recovery
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_types_auth.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_delivery_http_response.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_delivery_http_response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_delivery_http_response.Envelope'
      summary: Request password reset
      tags:
      - auth
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates a user by email and password, issuing an access token
        (stateless JWT) and a rotating refresh token.
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_types_auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_delivery_http_response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_types_auth.LoginResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_delivery_http_response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_delivery_http_response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_delivery_http_response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_delivery_http_response.Envelope'
      summary: Authenticate user
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      consumes:
      - application/json
      description: Revokes the presented refresh token and invalidates the session.
        Requires a valid access token.
      parameters:
      - description: Logout payload containing the refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_types_auth.LogoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_delivery_http_response.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_delivery_http_response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_delivery_http_response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_delivery_http_response.Envelope'
      security:
      - BearerAuth: []
      summary: Log out user
      tags:
      - auth
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: Rotates a valid refresh token and issues a new access token and
        refresh token.
      parameters:
      - description: Refresh token payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_types_auth.TokenRefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_delivery_http_response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_types_auth.TokenRefreshResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_delivery_http_response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_delivery_http_response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_delivery_http_response.Envelope'
      summary: Refresh tokens
      tags:
      - auth
  /api/v1/auth/reset-password:
    post:
      consumes:
      - application/json
      description: Resets a user's password using a valid, unexpired reset token.
      parameters:
      - description: Reset token and new password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_types_auth.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_delivery_http_response.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_delivery_http_response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_delivery_http_response.Envelope'
      summary: Reset password
      tags:
      - auth
  /api/v1/health:
    get:
      description: Returns application and database connectivity status. Used by load
        balancers, Kubernetes probes, monitoring, and client SDK smoke tests.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_delivery_http_response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/internal_delivery_http_handlers.HealthResponse'
              type: object
      summary: Report application and database health
      tags:
      - health
  /api/v1/invitations/accept:
    post:
      consumes:
      - application/json
      parameters:
      - description: Token and new password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_types_invitation.AcceptInvitationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_delivery_http_response.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_delivery_http_response.Envelope'
      summary: Accept invitation
      tags:
      - invitations
  /api/v1/roles:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_delivery_http_response.Envelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_types_role.RoleResponse'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_delivery_http_response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_delivery_http_response.Envelope'
      security:
      - BearerAuth: []
      summary: List assignable roles
      tags:
      - roles
  /api/v1/users/invitations:
    get:
      parameters:
      - description: Page (1-based)
        in: query
        name: page
        type: integer
      - description: Page size (max 100)
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_delivery_http_response.Envelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_types_invitation.InvitationResponse'
                  type: array
              type: object
      security:
      - BearerAuth: []
      summary: List invitations
      tags:
      - invitations
    post:
      consumes:
      - application/json
      parameters:
      - description: Invitation details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_types_invitation.InviteUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_delivery_http_response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_types_invitation.InvitationResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_delivery_http_response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_delivery_http_response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_delivery_http_response.Envelope'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_delivery_http_response.Envelope'
      security:
      - BearerAuth: []
      summary: Invite user
      tags:
      - invitations
  /api/v1/users/invitations/{id}:
    delete:
      parameters:
      - description: Invitation ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
