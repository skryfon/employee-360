basePath: /
definitions:
  github_com_skryfon_employee360_backend_internal_delivery_http_response.Envelope:
    properties:
      data: {}
      error:
        $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_delivery_http_response.ErrorInfo'
      meta:
        $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_delivery_http_response.Meta'
      success:
        type: boolean
    type: object
  github_com_skryfon_employee360_backend_internal_delivery_http_response.ErrorInfo:
    properties:
      code:
        type: string
      details: {}
      message:
        type: string
    type: object
  github_com_skryfon_employee360_backend_internal_delivery_http_response.Meta:
    properties:
      page:
        type: integer
      page_size:
        type: integer
      total_items:
        type: integer
      total_pages:
        type: integer
    type: object
  github_com_skryfon_employee360_backend_internal_domain_entity.InvitationStatus:
    enum:
    - pending
    - accepted
    - revoked
    - expired
    type: string
    x-enum-varnames:
    - InvitationStatusPending
    - InvitationStatusAccepted
    - InvitationStatusRevoked
    - InvitationStatusExpired
  github_com_skryfon_employee360_backend_internal_domain_entity.Role:
    properties:
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      tenant_id:
        type: string
      updated_at:
        type: string
    type: object
  github_com_skryfon_employee360_backend_internal_domain_entity.User:
    properties:
      created_at:
        type: string
      department_id:
        type: string
      email:
        type: string
      email_verified_at:
        type: string
      first_name:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      last_login_at:
        type: string
      last_name:
        type: string
      position_id:
        type: string
      roles:
        description: |-
          Associations (populated when loaded).

          gorm:"-" is required, not cosmetic: without it GORM's default schema
          parser tries to guess a many2many association for this field and
          fails at Create/Update time ("invalid field found ... define a valid
          foreign key for relations or implement the Valuer/Scanner interface"),
          since there is no matching Role.Users/UserID field for it to infer a
          relationship from. Roles is populated manually by the persistence
          layer via an explicit join query instead (see
          internal/infrastructure/persistence/user_repository.go's loadRoles),
          so GORM must never treat it as a column or association on its own.
        items:
          $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_domain_entity.Role'
        type: array
      tenant_id:
        type: string
      updated_at:
        type: string
    type: object
  github_com_skryfon_employee360_backend_internal_types_auth.ForgotPasswordRequest:
    properties:
      email:
        type: string
    type: object
  github_com_skryfon_employee360_backend_internal_types_auth.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  github_com_skryfon_employee360_backend_internal_types_auth.LoginResponse:
    properties:
      access_token:
        type: string
      expires_at:
        type: string
      refresh_token:
        type: string
      token_type:
        type: string
      user:
        $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_domain_entity.User'
    type: object
  github_com_skryfon_employee360_backend_internal_types_auth.LogoutRequest:
    properties:
      refresh_token:
        type: string
    type: object
  github_com_skryfon_employee360_backend_internal_types_auth.ResetPasswordRequest:
    properties:
      new_password:
        type: string
      token:
        type: string
    type: object
  github_com_skryfon_employee360_backend_internal_types_auth.TokenRefreshRequest:
    properties:
      refresh_token:
        type: string
    type: object
  github_com_skryfon_employee360_backend_internal_types_auth.TokenRefreshResponse:
    properties:
      access_token:
        type: string
      expires_at:
        type: string
      refresh_token:
        type: string
      token_type:
        type: string
    type: object
  github_com_skryfon_employee360_backend_internal_types_dashboard.AdminDashboardResponse:
    properties:
      departments:
        type: integer
      invitations:
        $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_types_dashboard.InvitationCountsResponse'
      positions:
        type: integer
      recent_invitations:
        items:
          $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_types_invitation.InvitationListItemResponse'
        type: array
      users:
        $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_types_dashboard.UserCountsResponse'
    type: object
  github_com_skryfon_employee360_backend_internal_types_dashboard.InvitationCountsResponse:
    properties:
      accepted:
        type: integer
      expired:
        type: integer
      pending:
        type: integer
      revoked:
        type: integer
    type: object
  github_com_skryfon_employee360_backend_internal_types_dashboard.RoleUserCountResponse:
    properties:
      active:
        type: integer
      inactive:
        type: integer
      role:
        type: string
      total:
        type: integer
    type: object
  github_com_skryfon_employee360_backend_internal_types_dashboard.SuperAdminDashboardResponse:
    properties:
      departments:
        type: integer
      invitations:
        $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_types_dashboard.InvitationCountsResponse'
      positions:
        type: integer
      recent_invitations:
        items:
          $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_types_invitation.InvitationListItemResponse'
        type: array
      tenant:
        $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_types_dashboard.TenantInfoResponse'
      users:
        $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_types_dashboard.UserCountsResponse'
      users_by_role:
        items:
          $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_types_dashboard.RoleUserCountResponse'
        type: array
    type: object
  github_com_skryfon_employee360_backend_internal_types_dashboard.TenantInfoResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      name:
        type: string
    type: object
  github_com_skryfon_employee360_backend_internal_types_dashboard.UserCountsResponse:
    properties:
      active:
        type: integer
      inactive:
        type: integer
      pending_invited:
        type: integer
      total:
        type: integer
    type: object
  github_com_skryfon_employee360_backend_internal_types_invitation.AcceptInvitationRequest:
    properties:
      password:
        type: string
      token:
        type: string
    type: object
  github_com_skryfon_employee360_backend_internal_types_invitation.InvitationListItemResponse:
    properties:
      accepted_at:
        type: string
      created_at:
        type: string
      department_id:
        type: string
      email:
        type: string
      expires_at:
        type: string
      id:
        type: string
      invited_by:
        $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_types_invitation.InvitedByResponse'
      invited_on:
        type: string
      position_id:
        type: string
      revoked_at:
        type: string
      role:
        type: string
      role_id:
        type: string
      status:
        $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_domain_entity.InvitationStatus'
    type: object
  github_com_skryfon_employee360_backend_internal_types_invitation.InvitationResponse:
    properties:
      accepted_at:
        type: string
      created_at:
        type: string
      department_id:
        type: string
      email:
        type: string
      expires_at:
        type: string
      id:
        type: string
      invited_by:
        type: string
      position_id:
        type: string
      revoked_at:
        type: string
      role_id:
        type: string
      status:
        $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_domain_entity.InvitationStatus'
    type: object
  github_com_skryfon_employee360_backend_internal_types_invitation.InviteUserRequest:
    properties:
      department_id:
        type: string
      email:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      position_id:
        type: string
      role_id:
        type: string
    type: object
  github_com_skryfon_employee360_backend_internal_types_invitation.InvitedByResponse:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  github_com_skryfon_employee360_backend_internal_types_invitation.ValidateInvitationResponse:
    properties:
      email:
        type: string
      role:
        description: |-
          Role is the invitee's role name (e.g. "admin", "employee"); clients use it
          to send the invitee to the correct app.
        type: string
    type: object
  github_com_skryfon_employee360_backend_internal_types_role.RoleResponse:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  github_com_skryfon_employee360_backend_internal_types_tenant.AddDomainRequest:
    properties:
      domain:
        description: Fully qualified domain with at least two labels, e.g. example.com;
          single-label hosts like localhost are not supported.
        example: acme.io
        type: string
    type: object
  github_com_skryfon_employee360_backend_internal_types_tenant.TenantDetailResponse:
    properties:
      created_at:
        type: string
      domains:
        items:
          $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_types_tenant.TenantDomainResponse'
        type: array
      id:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      updated_at:
        type: string
    type: object
  github_com_skryfon_employee360_backend_internal_types_tenant.TenantDomainResponse:
    properties:
      created_at:
        type: string
      domain:
        type: string
      id:
        type: string
      tenant_id:
        type: string
    type: object
  github_com_skryfon_employee360_backend_internal_types_tenant.TenantResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      updated_at:
        type: string
    type: object
  github_com_skryfon_employee360_backend_internal_types_tenant.UpdateDomainRequest:
    properties:
      domain:
        description: Fully qualified domain with at least two labels, e.g. example.com;
          single-label hosts like localhost are not supported.
        example: acme.io
        type: string
    type: object
  github_com_skryfon_employee360_backend_internal_types_tenant.UpdateTenantRequest:
    properties:
      name:
        example: Acme Corporation
        type: string
    type: object
  internal_delivery_http_handlers.HealthResponse:
    properties:
      app:
        type: string
      database:
        type: string
      redis:
        description: Redis is "ok", "unreachable", or "disabled"; it never changes
          the HTTP status.
        type: string
      status:
        type: string
    type: object
info:
  contact: {}
  description: REST API for Employee360, an open-source, self-hostable, multi-tenant
    employee platform. Includes unversioned operational endpoints (health checks)
    and the versioned client-facing API under /api/v1.
  title: Employee360 API
  version: "1.0"
paths:
  /api/v1/auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Requests a password reset token to be sent to the given email address.
        Always returns 200 OK to prevent user enumeration.
      parameters:
      - description: Email for password recovery
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_types_auth.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_delivery_http_response.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_delivery_http_response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_delivery_http_response.Envelope'
      summary: Request password reset
      tags:
      - auth
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates a user by email and password, issuing an access token
        (stateless JWT) and a rotating refresh token.
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_types_auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_delivery_http_response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_types_auth.LoginResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_delivery_http_response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_delivery_http_response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_delivery_http_response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_delivery_http_response.Envelope'
      summary: Authenticate user
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      consumes:
      - application/json
      description: Revokes the presented refresh token and invalidates the session.
        Requires a valid access token.
      parameters:
      - description: Logout payload containing the refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_types_auth.LogoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_delivery_http_response.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_delivery_http_response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_delivery_http_response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_delivery_http_response.Envelope'
      security:
      - BearerAuth: []
      summary: Log out user
      tags:
      - auth
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: Rotates a valid refresh token and issues a new access token and
        refresh token.
      parameters:
      - description: Refresh token payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_types_auth.TokenRefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_delivery_http_response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_types_auth.TokenRefreshResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_delivery_http_response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_delivery_http_response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_delivery_http_response.Envelope'
      summary: Refresh tokens
      tags:
      - auth
  /api/v1/auth/reset-password:
    post:
      consumes:
      - application/json
      description: Resets a user's password using a valid, unexpired reset token.
      parameters:
      - description: Reset token and new password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_types_auth.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_delivery_http_response.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_delivery_http_response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_delivery_http_response.Envelope'
      summary: Reset password
      tags:
      - auth
  /api/v1/dashboard/admin:
    get:
      description: Counts of users, invitations by status, departments and positions
        for the caller's tenant, plus the 5 most recent invitations.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_delivery_http_response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_types_dashboard.AdminDashboardResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_delivery_http_response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_delivery_http_response.Envelope'
      security:
      - BearerAuth: []
      summary: Tenant admin dashboard
      tags:
      - dashboard
  /api/v1/dashboard/super-admin:
    get:
      description: 'Organisation overview of the caller''s tenant: tenant info, user
        counts (total/active/inactive/pending-invited and by role), invitations by
        status, departments, positions and the 5 most recent invitations. super_admin
        only; no cross-tenant aggregates.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_delivery_http_response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_types_dashboard.SuperAdminDashboardResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_delivery_http_response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_delivery_http_response.Envelope'
      security:
      - BearerAuth: []
      summary: Super admin dashboard
      tags:
      - dashboard
  /api/v1/health:
    get:
      description: Returns application, database and (optional) Redis connectivity
        status. Redis reports ok, unreachable or disabled and never changes the HTTP
        status. Used by load balancers, Kubernetes probes, monitoring, and client
        SDK smoke tests.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_delivery_http_response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/internal_delivery_http_handlers.HealthResponse'
              type: object
      summary: Report application and database health
      tags:
      - health
  /api/v1/invitations/accept:
    post:
      consumes:
      - application/json
      parameters:
      - description: Token and new password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_types_invitation.AcceptInvitationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_delivery_http_response.Envelope'
        "400":
          description: INVALID_TOKEN or validation error
          schema:
            $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_delivery_http_response.Envelope'
        "403":
          description: INVITATION_REVOKED
          schema:
            $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_delivery_http_response.Envelope'
        "409":
          description: INVITATION_ACCEPTED
          schema:
            $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_delivery_http_response.Envelope'
        "410":
          description: INVITATION_EXPIRED
          schema:
            $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_delivery_http_response.Envelope'
      summary: Accept invitation
      tags:
      - invitations
  /api/v1/invitations/validate:
    get:
      parameters:
      - description: Invitation token
        in: query
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_delivery_http_response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_types_invitation.ValidateInvitationResponse'
              type: object
        "400":
          description: INVALID_TOKEN
          schema:
            $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_delivery_http_response.Envelope'
        "403":
          description: INVITATION_REVOKED
          schema:
            $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_delivery_http_response.Envelope'
        "409":
          description: INVITATION_ACCEPTED
          schema:
            $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_delivery_http_response.Envelope'
        "410":
          description: INVITATION_EXPIRED
          schema:
            $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_delivery_http_response.Envelope'
      summary: Validate invitation token
      tags:
      - invitations
  /api/v1/roles:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_delivery_http_response.Envelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_types_role.RoleResponse'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_delivery_http_response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_delivery_http_response.Envelope'
      security:
      - BearerAuth: []
      summary: List assignable roles
      tags:
      - roles
  /api/v1/tenant:
    get:
      description: Returns the caller's own tenant and its live domains (super_admin
        only). The tenant is taken from the auth context.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_delivery_http_response.Envelope'
            - properties:
