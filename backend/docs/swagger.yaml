          schema:
            $ref: '#/definitions/github_com_skryfon_employee360_backend_internal_delivery_http_response.Envelope'
      security:
      - BearerAuth: []
      summary: Revoke invitation
      tags:
      - invitations
  /api/v1/users/invitations/{id}/resend:
    post:
      parameters:
      - description: Invitation ID
        in: path
        name: id
