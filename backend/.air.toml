root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/api ./cmd/api"
  bin = "./tmp/api"
  full_bin = "./tmp/api"
  include_ext = ["go", "yaml", "yml", "env"]
  exclude_dir = ["tmp", "bin", "docs", "migrations"]
  exclude_regex = ["_test\\.go"]
  delay = 200
  stop_on_error = true
  send_interrupt = true
  kill_delay = "2s"
  rerun = false
  log = "air.log"

[log]
  time = true

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true
