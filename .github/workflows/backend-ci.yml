name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/backend-ci.yml"

jobs:
  check:
    name: build, vet, fmt, test, live-db
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: employee360
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: employee360
      DATABASE_SSLMODE: disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: verify docker-compose configurations
        run: |
          docker compose -f docker-compose.yml config
          docker compose -f backend/docker-compose.yml config

      - name: run make check-backend (build, vet, fmt, test)
        run: make check-backend

      - name: smoke-test dev and migrate entrypoints
        working-directory: backend
        run: |
          timeout 10s go run ./cmd/api
          timeout 10s go run ./cmd/migrate up
          timeout 10s go run ./cmd/migrate status
