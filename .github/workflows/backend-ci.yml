name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/backend-ci.yml"

jobs:
  # ─────────────────────────────────────────────────────────
  # build — compile, vet, gofmt, scaffolding structure. No DB needed.
  # ─────────────────────────────────────────────────────────
  build:
    name: Build, Vet, Fmt, Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: build
        run: make build-backend

      - name: vet
        run: make vet

      - name: fmt check
        run: make fmt-check

      - name: check-structure
        run: make check-structure

  # ─────────────────────────────────────────────────────────
  # unit — go unit tests, no live DB required.
  # ─────────────────────────────────────────────────────────
  unit:
    name: Go Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: run unit tests
        run: make test-backend

  # ─────────────────────────────────────────────────────────
  # integration — go integration tests (backend/integration/),
  # with a real Postgres service container.
  # ─────────────────────────────────────────────────────────
  integration:
    name: Go Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: employee360
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: employee360
      DATABASE_SSLMODE: disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: run integration tests
        run: make test-backend-integration

  # ─────────────────────────────────────────────────────────
  # smoke-test — docker-compose config + real dev/migrate entrypoints
  # against a live Postgres service container.
  # ─────────────────────────────────────────────────────────
  smoke-test:
    name: Smoke Test (dev, migrate, docker-compose)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: employee360
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: employee360
      DATABASE_SSLMODE: disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: verify docker-compose configurations
        run: |
          docker compose -f docker-compose.yml config
          docker compose -f backend/docker-compose.yml config

      - name: download go modules
        working-directory: backend
        run: go mod download

      - name: smoke-test dev entrypoint (health check)
        working-directory: backend
        # go run ./cmd/api blocks forever once it starts (it's an HTTP
        # server with graceful shutdown), so `timeout Ns go run ...` would
        # *always* exit 124 on a successful boot once the timer fires,
        # which aborts the script under bash's default -e. Boot it in the
        # background, poll the health endpoint instead, and kill it
        # ourselves once we've proven it's up.
        run: |
          go run ./cmd/api > /tmp/api-smoke.log 2>&1 &
          api_pid=$!
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8080/api/v1/health -o /tmp/health.json; then
              break
            fi
            sleep 1
          done
          if ! curl -sf http://localhost:8080/api/v1/health -o /tmp/health.json; then
            echo "api never became healthy; log:"
            cat /tmp/api-smoke.log
            exit 1
          fi
          cat /tmp/health.json
          kill "$api_pid" 2>/dev/null || true
          wait "$api_pid" 2>/dev/null || true

      - name: smoke-test migrate entrypoints
        working-directory: backend
        run: |
          timeout 10s go run ./cmd/migrate up
          timeout 10s go run ./cmd/migrate status
