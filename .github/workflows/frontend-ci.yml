name: Frontend CI

on:
  push:
    paths:
      - "clients/**"
      - "packages/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "clients/**"
      - "packages/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/frontend-ci.yml"

jobs:
  check:
    name: install, lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      - name: run make check-clients (lint, typecheck, build)
        run: make check-clients

      - name: smoke-test admin and employee dev servers
        run: |
          pnpm --filter admin dev --port 5183 --strictPort > /tmp/admin-dev.log 2>&1 &
          pnpm --filter employee dev --port 5184 --strictPort > /tmp/employee-dev.log 2>&1 &
          for i in $(seq 1 15); do
            if curl -sf http://localhost:5183/ -o /tmp/admin.html && curl -sf http://localhost:5184/ -o /tmp/employee.html; then
              break
            fi
            sleep 1
          done
          grep -q "Employee360 Admin" /tmp/admin.html
          grep -q "Employee360 Employee Portal" /tmp/employee.html
          pkill -f "vite.*--port 5183" 2>/dev/null || true
          pkill -f "vite.*--port 5184" 2>/dev/null || true
